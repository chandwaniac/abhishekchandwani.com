<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing · Abhishek Chandwani</title>
<meta name="description" content="Writing by Abhishek Chandwani.">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111113'/%3E%3Ctext x='32' y='42' font-family='Menlo,monospace' font-size='26' fill='%23e8e6e1' text-anchor='middle'%3Eac%3C/text%3E%3C/svg%3E">
</head>
<body>
<main>
  <a class="crumb" href="/">&larr; home</a>
  <section>
    <h2>Writing</h2>
    {% if site.posts.size == 0 %}
    <p class="item-note" style="padding-top:1.1rem">Nothing here yet.</p>
    {% else %}
    <ul>
      {% for post in site.posts %}
      <li><a class="item-link" href="{{ post.url }}">
        <span class="item-title">{{ post.title }}</span>
        <span class="tag">{{ post.date | date: "%b %Y" }}</span>
      </a></li>
      {% endfor %}
    </ul>
    {% endif %}
  </section>
  <footer>Abhishek Chandwani · <a href="/">abhishekchandwani.com</a></footer>
</main>
</body>
</html>
